version: '3.8'

services:
  # ------------------------------------------------------
  # Database Layer (PostgreSQL)
  # ------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: forgeci-postgres
    restart: always
    environment:
      POSTGRES_DB: forgeci
      POSTGRES_USER: forgeci
      POSTGRES_PASSWORD: forgeci
    ports:
      - "5432:5432"
    volumes:
      - forgeci-pgdata:/var/lib/postgresql/data
    networks:
      - forgeci-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeci -d forgeci"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # Cache & Coordination Layer (Redis)
  # ------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: forgeci-redis
    restart: always
    command: redis-server --requirepass forgeci
    ports:
      - "6379:6379"
    volumes:
      - forgeci-redisdata:/data
    networks:
      - forgeci-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "forgeci", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # Event Messaging Layer (Apache Kafka in KRaft Mode)
  # ------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: forgeci-kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LBR: 'true'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - forgeci-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # Object Storage (MinIO)
  # ------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: forgeci-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: forgeci
      MINIO_ROOT_PASSWORD: forgeciadmin
    command: server /data --console-address ":9001"
    volumes:
      - forgeci-miniodata:/data
    networks:
      - forgeci-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-creator Sidecar
  minio-init:
    image: minio/mc:latest
    container_name: forgeci-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 forgeci forgeciadmin;
      /usr/bin/mc mb --ignore-existing local/forgeci-logs;
      /usr/bin/mc mb --ignore-existing local/forgeci-artifacts;
      /usr/bin/mc policy set public local/forgeci-logs;
      /usr/bin/mc policy set public local/forgeci-artifacts;
      exit 0;
      "
    networks:
      - forgeci-net

  # ------------------------------------------------------
  # Metrics Aggregation & Scraping (Prometheus)
  # ------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: forgeci-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - forgeci-net
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # Observability Dashboard (Grafana)
  # ------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: forgeci-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - forgeci-net
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  forgeci-net:
    driver: bridge

volumes:
  forgeci-pgdata:
  forgeci-redisdata:
  forgeci-miniodata:
