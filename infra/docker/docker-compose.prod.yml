services:
  # ═══════════════════════════════════════
  # Infrastructure
  # ═══════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: forgeci-postgres
    environment:
      POSTGRES_DB: forgeci
      POSTGRES_USER: forgeci
      POSTGRES_PASSWORD: forgeci_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeci"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgeci-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ═══════════════════════════════════════
  # Application Services
  # ═══════════════════════════════════════
  orchestrator:
    build:
      context: ../../
      dockerfile: apps/orchestrator-service/Dockerfile
    container_name: forgeci-orchestrator
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeci
      SPRING_DATASOURCE_USERNAME: forgeci
      SPRING_DATASOURCE_PASSWORD: forgeci_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../../
      dockerfile: apps/worker-manager/Dockerfile
    container_name: forgeci-worker
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ORCHESTRATOR_URL: http://orchestrator:8082
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped

  # ═══════════════════════════════════════
  # Reverse Proxy
  # ═══════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: forgeci-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  pgdata:
