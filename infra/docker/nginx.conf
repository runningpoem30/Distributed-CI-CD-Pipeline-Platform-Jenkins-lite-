upstream orchestrator {
    server orchestrator:8082;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── HTTP to HTTPS Redirect ──
server {
    listen 80;
    server_name api-forgeci.goarya.dev;
    return 301 https://$host$request_uri;
}

# ── HTTPS (SSL Configuration) ──
server {
    listen 443 ssl;
    server_name api-forgeci.goarya.dev;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api-forgeci.goarya.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-forgeci.goarya.dev/privkey.pem;

    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── REST API ──
    location /api/ {
        proxy_pass http://orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (live logs) ──
    location /ws/ {
        proxy_pass http://orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://orchestrator/api/v1/pipelines/health;
    }
}
