server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: orchestrator-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/pipelines/**, /api/v1/executions/**, /api/v1/repositories/**
        - id: log-streaming-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/stream/**
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
